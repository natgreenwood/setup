name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The image runs as root while the checkout is owned by the runner user,
      # so safe.directory is set explicitly rather than relying on the image's
      # own git config. If git cannot read the repo ("dubious ownership"),
      # gitleaks logs "0 commits scanned" and still exits 0, so the scanned
      # count is checked as well as the exit code.
      - name: Scan full git history with gitleaks
        shell: bash
        run: |
          set -uo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git --redact -v --no-banner --no-color /repo 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "::error title=gitleaks::gitleaks exited with status $status (leaks found or scan error); see the log above"
            exit "$status"
          fi

          scanned=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/gitleaks.log" | grep -oE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' | tail -n 1)
          if [ "${scanned:-0}" -eq 0 ]; then
            echo "::error title=gitleaks::gitleaks scanned 0 commits, so the repository was not read; failing rather than reporting a false pass"
            exit 1
          fi
          echo "gitleaks scanned $scanned commits with no leaks found"
